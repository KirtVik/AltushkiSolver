<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Врум врум</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>


    <h1>Врум</h1>
    <div id="reference-grid"></div>
    
    <div class="puzzle-constructor">
        <div class="constructor-container">
            <h2>Доступные блоки</h2>
            <div id="source-blocks" class="blocks-container">
                
            </div>
        </div>
        
        <div class="constructor-container">
            <h2>Ваша мозаика</h2>
            <div id="target-grid" class="blocks-container">

            </div>
        </div>
    </div>
    
    <div class="controls-container">
        <button id="buildPuzzleButton" class="action-button">Собрать мозаику</button>
        <button id="replayPuzzleButton" class="action-button" style="display: none;">Повторить анимацию</button>
        <button id="resetPuzzleButton" class="action-button reset-button">Сбросить</button>
    </div>
    
    <div id="animationControls" class="animation-controls" style="display: none;">
        <button id="animSpeedSlow" class="icon-button" title="Скорость 0.5x"><span>0.5x</span></button>
        <button id="animSpeedNormal" class="icon-button active" title="Скорость 1x"><span>1x</span></button>
        <button id="animSpeedFast" class="icon-button" title="Скорость 2.5x"><span>2.5x</span></button>
        <button id="animSkip" class="icon-button skip-btn" title="Пропустить анимацию">
            <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="5 4 15 12 5 20 5 4"></polygon>
                <line x1="19" y1="5" x2="19" y2="19"></line>
            </svg>
        </button>
    </div>
    


    <h2>Матрица игры:</h2>
    <div id="puzzle">
        <div class="tile" data-index="0"></div>
        <div class="tile" data-index="1"></div>
        <div class="tile" data-index="2"></div>
        <div class="tile" data-index="3"></div>
        <div class="tile" data-index="4"></div>
        <div class="tile" data-index="5"></div>
        <div class="tile" data-index="6"></div>
        <div class="tile" data-index="7"></div>
        <div class="tile" data-index="8"></div>
    </div>

    <ul id="stepsList"></ul>

    <script src="script.js"></script>
</body>
</html>
